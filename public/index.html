    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/node_modules/@fontsource/black-han-sans/latin-400.css">
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/noto-sans-kr/index.css">
    <link rel="stylesheet" href="/output.css">

    <title>not.ai.kr - AI가 아님을 증명하기</title>
  </head>
  <body>
    <div class="w-dvw h-dvhl flex justify-center">
      <div class="w-full h-full max-w-lg px-2 py-6 flex flex-col gap-4">
        <div class="flex">
          <div class="text-center grow">
            <h1 class="text-2xl ff-black">not.ai.kr</h1>
            <p class="text-sm">AI가 아님을 증명하기</p>
            <p class="text-xs">Made by <a target="_blank" href="https://pmh.codes" class="link">Minhyeok Park</a></p>
          </div>
          <div class="flex flex-col justify-end">
            <button id="reset" class="btn btn-error btn-soft btn-circle"><i data-lucide="rotate-ccw"></i></button>
          </div>
        </div>

        <div class="grow px-1 min-h-0">
          <div class="h-full overflow-y-scroll preview border border-base-300 rounded-xl p-6" id="chats">
            <div class="text-xs text-center text-neutral">
              <p>이 GPT는 사용자를 끔찍이도 싫어하며 당신을 고성능 AI라고 굳게 믿고 있습니다.</p>
              <p>채팅을 통해 당신이 AI가 아니라는 것을 증명하세요.</p>

              <div class="divider"></div>
            </div>
          </div>
        </div>

        <form id="submit" class="flex gap-2">
          <label class="input grow outline-0">
            <i class="h-[1em] opacity-50" data-lucide="message-circle"></i>

            <input id="input" autofocus type="text" class="grow" placeholder="ex) 나는 AI가 아니야!" />
          </label>
          <button id="submitbtn" class="btn btn-primary btn-circle"><i data-lucide="send-horizontal"></i></button>
        </form>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/node_modules/lucide/dist/umd/lucide.js"></script>
    <script src="/main.js"></script>
  </body>
</html>
